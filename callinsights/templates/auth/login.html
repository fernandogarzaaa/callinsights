<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - {{ app_name }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen px-4">
  <form method="post" action="/login" class="bg-white p-8 rounded-xl shadow w-full space-y-4" style="max-width:24rem">
    <div class="text-2xl font-bold tracking-tight"><span class="text-orange-600">&#9632;</span> Sign in</div>
    <p class="text-sm text-stone-500">{{ app_name }}</p>
    {% if error == 'rate' %}<div role="alert" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">Too many attempts. Please wait a few minutes and try again.</div>
    {% elif error %}<div role="alert" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded p-2">Invalid email or password.</div>{% endif %}
    <input name="email" type="email" aria-label="Email" required autocomplete="username" placeholder="Email" class="w-full border border-stone-300 rounded px-3 py-2">
    <input name="password" type="password" aria-label="Password" required autocomplete="current-password" placeholder="Password" class="w-full border border-stone-300 rounded px-3 py-2">
    <button class="w-full bg-orange-600 text-white rounded px-3 py-2 font-medium hover:bg-orange-700">Sign in</button>
  </form>
</body>
</html>
