# Used for authoring new migrations: `alembic -c alembic.ini revision --autogenerate -m "..."`.
# At runtime the app (and `callinsights migrate`) builds this config in code from DATABASE_URL.
[alembic]
script_location = callinsights/migrations
sqlalchemy.url = sqlite:///./data/callinsights.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
