target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "N"]
ignore = [
  # FastAPI's Depends()/File()/Form() in defaults is the framework's DI pattern.
  "B008",
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "E501"]
"callinsights/migrations/**" = ["E501"]
"callinsights/demo_data.py" = ["E501"]

[lint.isort]
known-first-party = ["callinsights"]
