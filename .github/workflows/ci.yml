name: ci

on:
  push:
    branches: [main, release/v1.0.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: python -m pytest --cov --cov-report=term --cov-fail-under=90

  mutation:
    name: mutation testing (testteeth)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: testteeth on core modules
        run: >-
          testteeth run
          --pytest-args "tests/unit -q -p no:cacheprovider -o addopts="
          --workers 4 --fail-under 85 --json mutation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation.json

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t callinsights:ci .
      - name: smoke test
        run: |
          docker run -d --name ci -p 8003:8003 \
            -e ENV=production \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e COOKIE_SECURE=false \
            -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=Ci-smoke-pass-1 \
            -e SEED_DEMO_DATA=1 -e ASR_PROVIDER=mock \
            -e DATABASE_URL=sqlite:////data/callinsights.db \
            callinsights:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8003/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8003/api/health
          TOKEN=$(curl -fsS -X POST http://localhost:8003/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Ci-smoke-pass-1"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8003/api/analytics
          test "$(docker inspect -f '{{.Config.User}}' callinsights:ci)" = "app"
      - name: container logs
        if: always()
        run: docker logs ci || true

  postgres:
    name: tests against PostgreSQL
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,postgres]"
      - name: migrations + API flow on postgres
        env:
          CALLINSIGHTS_TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: python -m pytest tests/integration/test_postgres.py -q
